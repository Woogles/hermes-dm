state_schema:
  campaign_id: paper-circus

  custom_fields:
    memory_marks:
      type: integer
      default: 3
      minimum: 0
      maximum: 5

    max_memory_marks:
      type: integer
      default: 3

    tickets_found:
      type: array
      default: []

    false_tickets:
      type: array
      default: []

    witnesses_confirmed:
      type: array
      default: []

    parade_routes:
      type: array
      default: []
