adventure:
  id: rain-that-never-fell
  act: 1
  level_range: "1-4"
  objective: |
    Restore the water route without creating a new flood or destroying the Ashfall Shrine water source.
  major_clues:
    - farmer remembers rain
    - drought in present
    - missing dam gate
  success_condition: return water route safely
  failure_condition: paradox +1
  paradox_risk:
    - If too much water is removed, Ashfall Shrine loses its water source.
    - If too much water is returned, the present market floods.
