version: 1.0

campaign:
  id: vanished-century
  title: The Vanished Century

author: Eric

difficulty: beginner

player_count:
  min: 3
  max: 5

level_range:
  start: 1
  end: 12

theme:
  - mystery
  - investigation
  - time-anomalies
  - modern-underhollow

style:
  combat: low
  roleplay: high
  exploration: medium

estimated_sessions: 24

campaign_type: story

ruleset: dnd-5.5e

recommended_players: beginner

ai_instructions:
  emphasize:
    - investigation
    - evidence
    - clues
    - simple choices
    - visible consequences

  avoid:
    - excessive combat
    - hidden information overload
    - instant death
    - complex time magic

  always:
    - provide at least one obvious clue
    - ask one question at a time
    - let failed checks still reveal something useful
    - show known facts clearly

  never:
    - completely block progression
    - make the answer unknowable without clues