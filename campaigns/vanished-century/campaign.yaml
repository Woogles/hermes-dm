version: 1.0

schema:
  campaign_metadata:
    description:
      type: text
      max_words: 60
    status:
      - draft
      - beta
      - released
      - deprecated

  runtime_variables:
    allowed_types:
      - integer
      - string
      - boolean
      - array
      - object
    fields:
      - type
      - default
      - min
      - max
      - allowed
    note: >
      Declares dynamic campaign state. Live values are stored in
      session-state.json under a "runtime" map. Defaults here are initial only,
      not hardcoded truth.

  resources:
    keys:
      - session
      - acts
      - factions
      - locations
      - adventures
      - npcs
      - encounters
      - items
      - rewards
    rule: every id must have a corresponding Layer 3 file.