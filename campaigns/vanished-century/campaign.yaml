Campaign 1: vanished-century
version: 1.0

campaign:
  id: vanished-century
  title: The Vanished Century

  description: >
    A beginner mystery-investigation campaign where a hidden magical world called
    Underhollow is rewriting people, objects, and memories across a modern city,
    leaving clean impossible holes. The party proves what happened instead of trusting memory.

author: Eric

difficulty: beginner
status: released

player_count:
  min: 3
  max: 5

level_range:
  start: 1
  end: 12

theme:
  - mystery
  - investigation
  - time-anomalies
  - modern-underhollow

style:
  combat: low
  roleplay: high
  exploration: medium

estimated_sessions: 24

campaign_type: story

ruleset: dnd-5.5e

recommended_players: beginner

ai_instructions:
  emphasize:
    - investigation
    - evidence
    - clues
    - simple choices
    - visible consequences
  avoid:
    - excessive combat
    - hidden information overload
    - instant death
    - complex time magic
  always:
    - provide at least one obvious clue
    - ask one question at a time
    - let failed checks still reveal something useful
    - show known facts clearly
  never:
    - completely block progression
    - make the answer unknowable without clues

runtime_variables:
  case_marks:
    type: integer
    default: 3
    min: 0
    max: 5
  max_case_marks:
    type: integer
    default: 3
  paradox_track:
    type: integer
    default: 0
    min: 0
    max: 5
  ring_anchors:
    type: integer
    default: 0
    min: 0
    max: 5
  ring_anchor_tokens:
    type: integer
    default: 0
    min: 0
    max: 5
  silver_council_trust:
    type: integer
    default: 0
    min: -100
    max: 100
  unseen_century_threat:
    type: integer
    default: 0
    min: 0
    max: 5
  known_facts:
    type: array
    default: []
  unresolved_questions:
    type: array
    default:
      - source-of-anomaly
  case_file:
    type: object
    default:
      known: []
      contradictions: []
      unresolved:
        - source-of-anomaly
      choices: []

