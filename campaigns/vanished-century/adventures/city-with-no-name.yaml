adventure:
  id: city-with-no-name
  act: 3
  level_range: "9-10"
  objective: |
    Decide what to do with a city that exists in records but not in witness memory.
  major_clues:
    - blank plaque
    - road named in one century but not another
    - tunnel leads to city no one entered
  success_condition: repair or protect the city
  failure_condition: city becomes dead year
  skill_challenge:
    - check: Investigation
      dc: 18
    - check: History
      dc: 18
    - check: Arcana
      dc: 20
    - check: Insight
      dc: 17