adventure:
  id: four-courts
  act: 3
  level_range: "10-12"
  objective: |
    Stabilize four anchors and decide how the century should exist.
  major_clues:
    - old museum anchor
    - bridge gap anchor
    - bramble anchor
    - crystal anchor
  success_condition: stable century ending
  failure_condition: unresolved paradox ending
  final_boss:
    name: Unwritten Archivist
    recommended_statblock: reskinned 5.5e CR 11-12 humanoid caster or ancient construct
    goal: force party to choose save witness, save record, or save future
  scene_template:
    - two obvious clues
    - one contradiction
    - one skill challenge
    - one resource cost
    - one consequence