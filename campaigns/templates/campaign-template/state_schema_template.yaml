state_schema:
  campaign_id: '{state_schema_campaign_id}'
  custom_fields:
    case_marks:
      type: '{state_schema_custom_fields_case_marks_type}'
      default: 0
      minimum: 0
      maximum: 0
    max_case_marks:
      type: '{state_schema_custom_fields_max_case_marks_type}'
      default: 0
    ring_anchors:
      type: '{state_schema_custom_fields_ring_anchors_type}'
      default: []
    faction_relationship:
      type: '{state_schema_custom_fields_faction_relationship_type}'
      default:
        midnight-circle: 0
        silver-council: 0
        grotto-market: 0
        unseen-century: 0
        aboveworld-news-bureau: 0
    known_facts:
      type: '{state_schema_custom_fields_known_facts_type}'
      default: []
    unresolved_questions:
      type: '{state_schema_custom_fields_unresolved_questions_type}'
      default:
      - '{state_schema_custom_fields_unresolved_questions_default_1}'
    case_file:
      type: '{state_schema_custom_fields_case_file_type}'
      default:
        known: []
        contradictions: []
        unresolved: []
        choices: []
